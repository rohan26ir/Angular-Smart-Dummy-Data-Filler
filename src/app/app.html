<div class="relative w-full min-h-screen bg-black text-white font-inter selection:bg-white selection:text-black flex flex-col justify-between">
  <!-- Reusable Looping Video Background -->
  <app-background-video />

  <!-- Reusable Header Navbar (Persistent on all pages) -->
  <app-navbar
    brandName="GHOSTINPUT"
    ctaText="ADD TO CHROME"
    (openMobileMenu)="menuOpen.set(true)"
  />

  <!-- Reusable Mobile Menu Overlay -->
  <app-mobile-menu
    [open]="menuOpen()"
    brandName="GHOSTINPUT"
    (close)="menuOpen.set(false)"
  />

  <!-- Main View for Pages (Home, Privacy, Terms) -->
  <main class="flex-grow pt-24 sm:pt-28">
    <router-outlet />
  </main>

  <!-- Reusable Footer (Persistent on all pages) -->
  <app-footer />
</div>
